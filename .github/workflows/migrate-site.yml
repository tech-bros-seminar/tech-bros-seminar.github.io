          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          if os.environ.get("GITHUB_REPOSITORY") != REPO or os.environ.get("GITHUB_REF") != "refs/heads/main":
              raise SystemExit("This migration is restricted to the intended repository main branch.")
          expected_head = os.environ["GITHUB_SHA"]
          remote = git("ls-remote", "origin", "refs/heads/main").split()
          if not remote or remote[0] != expected_head or git("rev-parse", "HEAD") != expected_head:
              raise SystemExit("main changed; stop and review the current repository before retrying.")
          if git("status", "--porcelain", "--untracked-files=all"):
              raise SystemExit("The checkout must be clean before importing.")
          if Path("content/catalog.json").exists():
              raise SystemExit("Website sources already exist; migration will not overwrite an earlier import.")

          packed = base64.b64decode("".join(PAYLOAD.split()), validate=True)
          if hashlib.sha256(packed).hexdigest() != PAYLOAD_SHA256:
              raise SystemExit("Embedded source archive checksum mismatch.")
          source = json.loads(gzip.decompress(packed).decode("utf-8"))
          if not isinstance(source, dict) or sorted(source) != EXPECTED_TEXT:
              raise SystemExit("Unexpected paths in the embedded source archive.")
          workspace = Path.cwd().resolve()

          def destination(name):
              relative = PurePosixPath(name)
              if relative.is_absolute() or ".." in relative.parts or ".git" in relative.parts:
                  raise SystemExit("Unsafe source path.")
              path = workspace.joinpath(*relative.parts)
              if workspace not in path.resolve().parents or any(p.is_symlink() for p in [path, *path.parents]):
                  raise SystemExit("Unsafe destination or symbolic link.")
              path.parent.mkdir(parents=True, exist_ok=True)
              return path

          for name, content in source.items():
              if not isinstance(content, str):
                  raise SystemExit("Embedded sources must be UTF-8 text.")
              destination(name).write_text(content, encoding="utf-8")

          for name, expected in BINARY.items():
              request = Request(ORIGIN + expected["path"], headers={"User-Agent": "Tech-bros-seminar-migration"})
              with urlopen(request, timeout=60) as response:
                  final = urlsplit(response.geturl())
                  if final.scheme != "https" or final.netloc != urlsplit(ORIGIN).netloc:
                      raise SystemExit("Unexpected binary download redirect.")
                  data = response.read(expected["size"] + 1)
              if len(data) != expected["size"] or hashlib.sha256(data).hexdigest() != expected["sha256"]:
                  raise SystemExit("Public binary failed its size or SHA256 check: " + name)
              destination(name).write_bytes(data)
          print("Restored 14 exact text source files and verified 5 public binary files.")
          PYIMPORT
      - name: Run publication checks
        run: python3 -B -m unittest discover -s tests -v
      - name: Build static website
        run: python3 -B scripts/build.py
      - name: Check website links and publication files
        run: python3 -B scripts/check_site.py
      - name: Commit only imported website sources
        id: commit
        shell: bash
        run: |
          python3 - <<'PYCOMMIT'
          import os, subprocess
          from pathlib import Path

          EXPECTED_PATHS = ['.gitignore', '.nojekyll', 'README.md', 'assets/cybernetic-brain.svg', 'assets/cybernetic-galois-v3.png', 'assets/favicon.svg', 'assets/fonts/LICENSE.txt', 'assets/fonts/NotoSans-Regular.woff', 'assets/fonts/NotoSerifDisplay-Italic.woff', 'assets/fonts/NotoSerifDisplay-Regular.woff', 'assets/site.css', 'assets/site.js', 'content/catalog.json', 'content/files/kourovka-18-78/review-status-v1.md', 'content/files/kourovka-18-78/simple-twisted-group-algebras-v1.pdf', 'content/files/kourovka-18-78/simple-twisted-group-algebras-v1.tex', 'scripts/build.py', 'scripts/check_site.py', 'tests/test_publication_gate.py']

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          expected_head = os.environ["GITHUB_SHA"]
          remote = git("ls-remote", "origin", "refs/heads/main").split()
          if not remote or remote[0] != expected_head or git("rev-parse", "HEAD") != expected_head:
              raise SystemExit("main changed; no migration commit will be published.")
          subprocess.run(["git", "add", "--", *EXPECTED_PATHS], check=True)
          staged = set(subprocess.check_output(["git", "diff", "--cached", "--name-only", "-z"]).decode().split("\0")) - {""}
          if not staged or not staged <= set(EXPECTED_PATHS) or any(p.startswith(".github/") for p in staged):
              raise SystemExit("Refusing to commit an empty or unexpected set of paths.")
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "commit", "-m", "Migrate Tech bros seminar website to GitHub Pages"], check=True)
          if git("rev-parse", "HEAD^") != expected_head:
              raise SystemExit("Unexpected migration parent; refusing to push.")
          subprocess.run(["git", "push", "origin", "HEAD:refs/heads/main"], check=True)
          commit = git("rev-parse", "HEAD")
          print("Published website source commit: " + commit)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("source_commit=" + commit + "\n")
          PYCOMMIT
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: import
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
